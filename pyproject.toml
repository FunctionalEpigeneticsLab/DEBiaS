[project]
name = "debias"
version = "1.0.0"
description = ""
authors = [
    { name = "Xinran Song" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pybedtools>=0.12.0"
]

[project.scripts]
debias = "debias.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

